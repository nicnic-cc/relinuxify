<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="relinuxify icon: a macOS terminal window with a penguin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34466a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <clipPath id="win">
      <rect x="32" y="44" width="192" height="140" rx="14"/>
    </clipPath>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- terminal window -->
  <g clip-path="url(#win)">
    <rect x="32" y="44" width="192" height="140" fill="#0d1117"/>
    <rect x="32" y="44" width="192" height="26" fill="#2a3446"/>
  </g>
  <rect x="32" y="44" width="192" height="140" rx="14" fill="none" stroke="#4b5b7a" stroke-width="2"/>
  <circle cx="50" cy="57" r="5" fill="#ff5f57"/>
  <circle cx="66" cy="57" r="5" fill="#febc2e"/>
  <circle cx="82" cy="57" r="5" fill="#28c840"/>
  <text x="48" y="110" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#4ade80">$</text>
  <rect x="70" y="91" width="14" height="22" fill="#4ade80"/>

  <!-- penguin -->
  <ellipse cx="146" cy="196" rx="9" ry="22" fill="#0b0b10" transform="rotate(18 146 196)"/>
  <ellipse cx="206" cy="196" rx="9" ry="22" fill="#0b0b10" transform="rotate(-18 206 196)"/>
  <ellipse cx="176" cy="188" rx="34" ry="42" fill="#0b0b10" stroke="#e5e7eb" stroke-width="3"/>
  <ellipse cx="176" cy="204" rx="22" ry="25" fill="#f8fafc"/>
  <circle cx="166" cy="164" r="6" fill="#f8fafc"/>
  <circle cx="186" cy="164" r="6" fill="#f8fafc"/>
  <circle cx="167" cy="165" r="3" fill="#0b0b10"/>
  <circle cx="185" cy="165" r="3" fill="#0b0b10"/>
  <path d="M167 173 L185 173 L176 184 Z" fill="#f59e0b"/>
  <ellipse cx="162" cy="230" rx="12" ry="5" fill="#f59e0b"/>
  <ellipse cx="190" cy="230" rx="12" ry="5" fill="#f59e0b"/>
</svg>
